name: Release

# Publishes the npm package and the Python package on a version tag, using
# trusted publishing (OIDC) for both registries. No API token is stored anywhere.
#
# One-time setup before the first release:
#   PyPI  https://pypi.org/manage/account/publishing/  add a pending publisher:
#           project neveroversell, owner pavangupta352, repository neveroversell,
#           workflow release.yml, environment pypi
#   npm   the first version is published by hand (npm login, npm publish --access public),
#         then on npmjs.com under the package's settings add a trusted publisher:
#           owner pavangupta352, repository neveroversell, workflow release.yml, environment npm
#
# Then: bump the version in package.json and python/pyproject.toml, update CHANGELOG.md,
#       git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check that the tag, package.json and pyproject.toml agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NPM=$(node -p "require('./package.json').version")
          PY=$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG npm=$NPM python=$PY"
          [ "$TAG" = "$NPM" ] && [ "$TAG" = "$PY" ] || { echo "::error::versions disagree"; exit 1; }
      - name: Check that the bundled SQL matches the repository SQL
        run: diff -r sql python/neveroversell/sql
      - run: pip install build
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run after a failure elsewhere must not die here on "version exists".
          skip-existing: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nos
          POSTGRES_PASSWORD: nos
          POSTGRES_DB: nos
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U nos -d nos" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://nos:nos@127.0.0.1:54329/nos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer; older npm gets a 404 from the registry.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      # setup-node writes a placeholder _authToken line; an invalid token beats OIDC, so remove it.
      - name: Remove the placeholder auth token so OIDC is used
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != version $PKG"; exit 1; }
      # prepublishOnly builds and runs the suite against the Postgres service above.
      - name: Publish if this version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "neveroversell@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::neveroversell@$VERSION is already on npm, skipping"
            exit 0
          fi
          npm publish --provenance --access public

  github-release:
    needs: [publish-pypi, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release if it does not exist, then attach the Python artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
